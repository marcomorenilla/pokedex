<!doctype html>
<html class="custom-scrollbar" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="shortcut icon" href="assets/console-1.svg" type="image/x-icon" />
  </head>

  <body class="roboto cursor-(--cursor-pokedex) bg-(--poke-white)">
    <nav
      class="shadow-lg relative bg-linear-to-r from-(--poke-yellow) to-(--poke-orange) rounded-sm md:rounded-b-2xl shadow- flex flex-col gap-5 justify-between items-start md:items-center p-10 w-full">
      <div class="flex gap-5 items-center justify-between">
        <img
          src="assets/logo.png"
          alt="pokemon logo"
          class="hidden md:block size-15 md:size-20" />
        <h1
          class="text-[var(--poke-white)] font-bold text-5xl text-shadow-lg text-shadow-(--poke-blue)">
          Pokédex
        </h1>
      </div>

      <section id="search-container" class="md:w-3/6 w-full">
        <div
          id="search-group-container"
          class="group flex relative w-full items-center gap-1">
          <input
            type="text"
            list="pokemon-list"
            name="search-input"
            id="search-input"
            placeholder="Introduce nombre o número..."
            class="w-full bg-[var(--poke-white)] opacity-75 py-1 md:px-4 px-1 focus:outline-none focus:border-3 focus:border-[var(--poke-white)] focus:shadow-xl focus:shadow-(--poke-white) rounded-lg" />

          <datalist id="pokemon-list"></datalist>

          <button
            id="search-btn"
            class="bg-[var(--poke-blue)] p-1 z-1 absolute right-0 rounded-r-lg hover:bg-blue-700 transition-all duration-300 group-focus-within:scale-110">
            <img
              src="assets/search-white.svg"
              alt="search-icon"
              class="size-6 cursor-pointer" />
          </button>
        </div>
      </section>
      <section
        id="open-team-btn"
        class="absolute right-10 md:right-40 cursor-pointer animate-opacidad">
        <img src="assets/pc.svg" alt="pc" class="size-15 hover:size-20" />
      </section>
    </nav>
    <main class="flex flex-col items-center">
      <div class="overflow-x-auto custom-scrollbar py-5 mr-3 w-full">
        <section id="types-section" class="flex gap-2 mt-2 px-10"></section>
      </div>

      <div
        id="grid-card-section"
        class="p-3 mt-2 grid grid-cols-2 md:grid-cols-2 lg:grid-cols-6 gap-3"></div>

      <div>
        <div id="scroll-trigger"></div>
      </div>
    </main>

    <aside
      id="team-section"
      class="z-3 fixed hidden top-0 animate-visible animate-opacidad right-0 md:w-xl h-screen bg-(--poke-yellow)/90 rounded-l-xl">
      <section class="flex px-2 gap-10 justify-center mt-5 mb-5 items-center">
        <h2
          class="text-3xl font-bold text-(--poke-white) text-center text-shadow-lg text-shadow-(--poke-blue)">
          Equipo
        </h2>
        <button
          id="close-team-btn"
          class="font-bold text-(--poke-yellow) bg-(--poke-white) rounded p-1 px-2 cursor-pointer hover:text-xl">
          x
        </button>
      </section>
      <section id="team-menu-section ">
        <div
          id="team-1"
          class="team-menu cursor-pointer border-b-2 border-b-(--poke-white) hover:bg-(--poke-white)">
          <h3
            class="text-(--poke-white) px-2 hover:text-(--poke-yellow) font-bold text-xl py-2">
            Equipo 1
          </h3>
        </div>
        <div
          id="team-2"
          class="team-menu cursor-pointer border-b-2 border-b-(--poke-white) hover:bg-(--poke-white)">
          <h3
            class="text-(--poke-white) px-2 hover:text-(--poke-yellow) font-bold text-xl py-2">
            Equipo 2
          </h3>
        </div>
        <div
          id="team-3"
          class="team-menu cursor-pointer border-b-2 border-b-(--poke-white) hover:bg-(--poke-white)">
          <h3
            class="text-(--poke-white) px-2 hover:text-(--poke-yellow) font-bold text-xl py-2">
            Equipo 3
          </h3>
        </div>
      </section>
      <section
        id="drag-section"
        class="grid grid-cols-1 md:grid-cols-2 overflow-y-auto max-h-[60vh] lg:grid-cols-3 gap-3 items-center justify-center px-2 mt-3"></section>

      <div
        id="team-action-buttons"
        class="flex flex-wrap items-center px-2 justify-center gap-2 mt-5">
        <button
          class="text-(--poke-white) font-bold rounded-sm bg-(--poke-blue) hover:bg-blue-700 p-2">
          Ver equipo
        </button>
        <button
          class="text-(--poke-white) font-bold rounded-sm bg-(--poke-red) hover:bg-red-700 p-2">
          Eliminar equipo
        </button>
      </div>
    </aside>

    <dialog
      id="loading-dialog"
      class="outline-none fixed self-center overflow-hidden justify-self-center bg-transparent">
      <div class="loading p-5">
        <h1
          class="text-2xl border-3 rounded-full p-2 bg-(--poke-white) border-(--poke-red) text-(--poke-red) flex font-bold">
          Cargando
          <p class="dots">.</p>
          <p class="dots">.</p>
          <p class="dots">.</p>
        </h1>
      </div>
    </dialog>

    <dialog
      id="no-content-dialog"
      class="outline-none fixed self-center justify-self-center md:rounded-full">
      <div class="flex flex-col items-center border-(--poke-red) bg-white p-3">
        <div class="loading p-5">
          <h1 class="text-2xl p-2 text-(--poke-red) font-bold">
            No se ha encontrado ninguna búsqueda que coincida, vuelve a
            intentarlo
          </h1>
        </div>
        <button
          class="no-content-dialog-btn bg-(--poke-red) text-white p-2 rounded-full font-bold hover:bg-red-700">
          Aceptar
        </button>
      </div>
    </dialog>

    <div
      id="pokemon-stats"
      class="fixed inset-0 overflow-y-auto flex items-center justify-center hidden p-2 z-2 bg-yellow-500/50 backdrop-blur-sm"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
